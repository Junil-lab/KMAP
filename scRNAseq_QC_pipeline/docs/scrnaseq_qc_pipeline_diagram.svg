<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 26px; font-weight: 700; fill: #1f2937; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #4b5563; }
      .box-title { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111827; }
      .box-num { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #0f766e; }
      .box-text { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #374151; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #4b5563; }
      .pill-text { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 700; fill: #374151; }
      .line { stroke: #4b5563; stroke-width: 2.2; fill: none; }
      .line-light { stroke: #9ca3af; stroke-width: 2; fill: none; }
      .dash { stroke-dasharray: 7 6; }
      .step { fill: #ffffff; stroke: #14b8a6; stroke-width: 2.2; rx: 2; }
      .final { fill: #ffffff; stroke: #f59e0b; stroke-width: 2.2; rx: 2; }
      .ref { fill: #ffffff; stroke: #9ca3af; stroke-width: 2.2; rx: 2; }
      .optional { fill: #ffffff; stroke: #9ca3af; stroke-width: 2.2; stroke-dasharray: 7 6; rx: 2; }
      .stripe-step { fill: #14b8a6; }
      .stripe-final { fill: #f59e0b; }
      .stripe-ref { fill: #6b7280; }
      .pill { fill: #f3f4f6; stroke: #cbd5e1; stroke-width: 1.2; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrowLight" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1220"/>
  <text x="58" y="52" class="title">K_map scRNA-seq Preprocessing and QC Pipeline</text>
  <text x="58" y="78" class="subtitle">Cell Ranger SIF + CellBender + Scanpy QC + SOLO doublet filtering</text>

  <!-- Legend -->
  <g transform="translate(1240,40)">
    <rect x="0" y="0" width="300" height="142" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
    <rect x="20" y="22" width="18" height="18" fill="#ffffff" stroke="#14b8a6" stroke-width="2"/>
    <rect x="20" y="22" width="5" height="18" fill="#14b8a6"/>
    <text x="50" y="36" class="small">Pipeline step</text>
    <rect x="20" y="52" width="18" height="18" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <rect x="20" y="52" width="5" height="18" fill="#f59e0b"/>
    <text x="50" y="66" class="small">Final output</text>
    <rect x="20" y="82" width="18" height="18" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <rect x="20" y="82" width="5" height="18" fill="#6b7280"/>
    <text x="50" y="96" class="small">Input / reference</text>
    <rect x="20" y="112" width="18" height="18" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="50" y="126" class="small">Optional start point</text>
  </g>

  <!-- Top inputs -->
  <g transform="translate(590,112)">
    <rect class="ref" width="360" height="92"/>
    <rect class="stripe-ref" width="8" height="92"/>
    <text x="22" y="28" class="box-num">00</text>
    <text x="22" y="50" class="box-title">FASTQ directory</text>
    <text x="22" y="72" class="box-text">sample_R1/R2/I1/I2 fastq.gz</text>
  </g>

  <g transform="translate(160,224)">
    <rect class="ref" width="330" height="92"/>
    <rect class="stripe-ref" width="8" height="92"/>
    <text x="22" y="28" class="box-title">10x Reference</text>
    <text x="22" y="50" class="box-text">User supplied transcriptome</text>
    <text x="22" y="72" class="box-text">refdata-gex-GRCm39/GRCh38</text>
  </g>

  <!-- Cell Ranger -->
  <rect class="pill" x="704" y="232" width="132" height="30" rx="10"/>
  <text x="740" y="252" class="pill-text">cellranger</text>
  <path class="line" marker-end="url(#arrow)" d="M770 204 L770 230"/>
  <path class="line" marker-end="url(#arrow)" d="M490 270 L704 247"/>

  <g transform="translate(590,292)">
    <rect class="step" width="360" height="104"/>
    <rect class="stripe-step" width="8" height="104"/>
    <text x="22" y="28" class="box-num">01</text>
    <text x="22" y="50" class="box-title">Cell Ranger Count</text>
    <text x="22" y="72" class="box-text">raw_feature_bc_matrix.h5</text>
    <text x="22" y="92" class="box-text">filtered matrix, metrics, web summary</text>
  </g>

  <!-- Optional raw_h5 start -->
  <g transform="translate(116,428)">
    <rect class="optional" width="330" height="92"/>
    <text x="22" y="28" class="box-title">Optional start: raw_h5</text>
    <text x="22" y="50" class="box-text">start_step=cellbender</text>
    <text x="22" y="72" class="box-text">10x raw feature matrix H5</text>
  </g>

  <!-- CellBender -->
  <rect class="pill" x="700" y="430" width="140" height="30" rx="10"/>
  <text x="728" y="450" class="pill-text">CellBender</text>
  <path class="line" marker-end="url(#arrow)" d="M770 396 L770 430"/>
  <path class="line-light dash" marker-end="url(#arrowLight)" d="M446 474 L590 474"/>

  <g transform="translate(590,490)">
    <rect class="step" width="360" height="104"/>
    <rect class="stripe-step" width="8" height="104"/>
    <text x="22" y="28" class="box-num">02</text>
    <text x="22" y="50" class="box-title">Remove Background</text>
    <text x="22" y="72" class="box-text">{sample}.cellbender_cleaned.h5</text>
    <text x="22" y="92" class="box-text">background-corrected count matrix</text>
  </g>

  <!-- Optional cleaned_h5 start -->
  <g transform="translate(116,626)">
    <rect class="optional" width="330" height="92"/>
    <text x="22" y="28" class="box-title">Optional start: cellbender_h5</text>
    <text x="22" y="50" class="box-text">start_step=qc</text>
    <text x="22" y="72" class="box-text">CellBender cleaned H5</text>
  </g>

  <!-- Scanpy QC -->
  <rect class="pill" x="708" y="628" width="124" height="30" rx="10"/>
  <text x="736" y="648" class="pill-text">Scanpy</text>
  <path class="line" marker-end="url(#arrow)" d="M770 594 L770 628"/>
  <path class="line-light dash" marker-end="url(#arrowLight)" d="M446 672 L590 672"/>

  <g transform="translate(590,688)">
    <rect class="step" width="360" height="120"/>
    <rect class="stripe-step" width="8" height="120"/>
    <text x="22" y="28" class="box-num">03</text>
    <text x="22" y="50" class="box-title">Scanpy QC for SOLO</text>
    <text x="22" y="72" class="box-text">Remove pct_counts_mt &gt;= 20</text>
    <text x="22" y="92" class="box-text">min_genes, min_counts, min_cells</text>
    <text x="22" y="112" class="box-text">full.h5ad + hvg2000.h5ad + QC CSV</text>
  </g>

  <!-- SOLO branch -->
  <path class="line" marker-end="url(#arrow)" d="M950 748 L1088 748"/>
  <rect class="pill" x="1112" y="610" width="104" height="30" rx="10"/>
  <text x="1149" y="630" class="pill-text">SOLO</text>
  <path class="line" marker-end="url(#arrow)" d="M1164 640 L1164 676"/>

  <g transform="translate(1022,676)">
    <rect class="step" width="284" height="104"/>
    <rect class="stripe-step" width="8" height="104"/>
    <text x="22" y="28" class="box-num">04</text>
    <text x="22" y="50" class="box-title">SOLO Doublet Scoring</text>
    <text x="22" y="72" class="box-text">{sample}.solo/soloed.h5ad</text>
    <text x="22" y="92" class="box-text">doublet scores and labels</text>
  </g>

  <!-- Filter singlets -->
  <rect class="pill" x="690" y="842" width="160" height="30" rx="10"/>
  <text x="716" y="862" class="pill-text">filter_singlets</text>
  <path class="line" marker-end="url(#arrow)" d="M770 808 L770 842"/>
  <path class="line" marker-end="url(#arrow)" d="M1164 780 C1164 856 950 858 870 858"/>

  <g transform="translate(590,896)">
    <rect class="step" width="360" height="104"/>
    <rect class="stripe-step" width="8" height="104"/>
    <text x="22" y="28" class="box-num">05</text>
    <text x="22" y="50" class="box-title">Filter SOLO Singlets</text>
    <text x="22" y="72" class="box-text">annotated full + singlet-only H5AD</text>
    <text x="22" y="92" class="box-text">SOLO labels, scores, doublet barcodes</text>
  </g>

  <g transform="translate(590,1034)">
    <rect class="final" width="394" height="82"/>
    <rect class="stripe-final" width="8" height="82"/>
    <text x="22" y="28" class="box-title">Final Cell-level H5ADs</text>
    <text x="22" y="50" class="box-text">{sample}_qc_solo_annotated_full.h5ad</text>
    <text x="22" y="70" class="box-text">{sample}_qc_solo_singlets_full.h5ad</text>
  </g>
  <path class="line" marker-end="url(#arrow)" d="M770 1000 L770 1034"/>

  <!-- QC merge -->
  <path class="line-light" marker-end="url(#arrowLight)" d="M890 808 C982 836 1018 852 1096 852"/>
  <path class="line-light" marker-end="url(#arrowLight)" d="M1164 780 L1164 836"/>
  <rect class="pill" x="1110" y="834" width="112" height="30" rx="10"/>
  <text x="1135" y="854" class="pill-text">merge_qc</text>

  <g transform="translate(1022,888)">
    <rect class="step" width="284" height="92"/>
    <rect class="stripe-step" width="8" height="92"/>
    <text x="22" y="28" class="box-num">06</text>
    <text x="22" y="50" class="box-title">QC Summary Merge</text>
    <text x="22" y="72" class="box-text">QC metrics + SOLO summary</text>
  </g>
  <path class="line" marker-end="url(#arrow)" d="M1164 980 L1164 1034"/>
  <g transform="translate(1022,1034)">
    <rect class="final" width="284" height="64"/>
    <rect class="stripe-final" width="8" height="64"/>
    <text x="22" y="28" class="box-title">Final QC Table</text>
    <text x="22" y="50" class="box-text">scrnaseq_qc_summary.csv</text>
  </g>

  <!-- Footer notes -->
  <text x="58" y="1158" class="subtitle">Configurable CSV start_step: cellranger, cellbender, or qc. Species is set by the user-supplied Cell Ranger transcriptome reference.</text>
  <text x="58" y="1184" class="subtitle">Default QC: pct_counts_mt &lt; 20, min_genes=200, min_counts=500, min_cells_gene=5, HVG=2000.</text>
</svg>
